<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>شجره‌نامه | مدیریت شجره‌نامه خانوادگی</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading-screen" class="loading-screen">
    <div class="loader"></div>
    <p>در حال بارگذاری شجره‌نامه...</p>
  </div>

  <!-- App Container -->
  <div id="app" class="app hidden">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon">🌳</span>
          <span class="logo-text">شجره‌نامه</span>
        </div>
        <button class="btn-icon" id="btn-toggle-sidebar" title="بستن منو">☰</button>
      </div>

      <div class="sidebar-section">
        <div class="section-title">پروژه‌ها</div>
        <div id="project-list" class="project-list"></div>
        <button class="btn btn-primary btn-block" id="btn-new-project">
          + پروژه جدید
        </button>
      </div>

      <div class="sidebar-section" id="people-section">
        <div class="section-title">
          افراد
          <span id="people-count" class="badge">0</span>
        </div>
        <div class="search-box">
          <input type="text" id="search-people" placeholder="جستجوی نام..." />
        </div>
        <div id="people-list" class="people-list"></div>
      </div>

      <div class="sidebar-footer">
        <button class="btn btn-outline btn-block" id="btn-export-menu">خروجی‌ها</button>
        <button class="btn btn-ghost btn-block" id="btn-settings">⚙️ تنظیمات</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <!-- Top Bar -->
      <header class="topbar">
        <div class="topbar-right">
          <h1 id="current-project-name">پروژه‌ای انتخاب نشده</h1>
          <span id="project-stats" class="project-stats"></span>
        </div>
        <div class="topbar-left">
          <button class="btn btn-sm" id="btn-add-person" title="افزودن فرد">
            + فرد جدید
          </button>
          <button class="btn btn-sm btn-outline" id="btn-zoom-fit">مناسب صفحه</button>
          <div class="view-mode">
            <button class="btn-icon active" data-mode="vertical" title="عمودی">↕️</button>
            <button class="btn-icon" data-mode="horizontal" title="افقی">↔️</button>
          </div>
        </div>
      </header>

      <!-- Tree Canvas -->
      <div class="tree-container" id="tree-container">
        <div class="tree-canvas" id="tree-canvas">
          <div id="tree-viewport" class="tree-viewport">
            <!-- Tree will be rendered here -->
          </div>
        </div>
        <div class="tree-controls">
          <button class="btn-icon" id="btn-zoom-in">+</button>
          <button class="btn-icon" id="btn-zoom-out">−</button>
          <button class="btn-icon" id="btn-reset-view">↺</button>
        </div>
        <div class="empty-state" id="empty-state">
          <div class="empty-icon">🌳</div>
          <h2>شجره‌نامه خالی است</h2>
          <p>برای شروع، یک فرد جدید اضافه کنید یا پروژه جدیدی بسازید.</p>
          <button class="btn btn-primary" id="btn-empty-add">افزودن اولین فرد</button>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal: New Project -->
  <div class="modal" id="modal-new-project">
    <div class="modal-content">
      <div class="modal-header">
        <h3>پروژه جدید</h3>
        <button class="btn-icon modal-close">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>نام پروژه (مثلاً خانواده آزادگان)</label>
          <input type="text" id="input-project-name" placeholder="نام خانواده یا خاندان" />
        </div>
        <div class="form-group">
          <label>توضیحات (اختیاری)</label>
          <textarea id="input-project-desc" rows="3" placeholder="توضیح کوتاه درباره این شجره‌نامه"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost modal-close">انصراف</button>
        <button class="btn btn-primary" id="btn-create-project">ایجاد پروژه</button>
      </div>
    </div>
  </div>

  <!-- Modal: Person Form -->
  <div class="modal" id="modal-person">
    <div class="modal-content modal-lg">
      <div class="modal-header">
        <h3 id="person-modal-title">افزودن فرد جدید</h3>
        <button class="btn-icon modal-close">×</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-group">
            <label>نام *</label>
            <input type="text" id="person-first-name" required />
          </div>
          <div class="form-group">
            <label>نام خانوادگی</label>
            <input type="text" id="person-last-name" />
          </div>
          <div class="form-group">
            <label>نام مستعار</label>
            <input type="text" id="person-nickname" />
          </div>
          <div class="form-group">
            <label>جنسیت</label>
            <select id="person-gender">
              <option value="male">مرد</option>
              <option value="female">زن</option>
              <option value="unknown">نامشخص</option>
            </select>
          </div>
          <div class="form-group">
            <label>تاریخ تولد</label>
            <input type="text" id="person-birth-date" placeholder="مثلاً ۱۳۲۰ یا 1941" />
          </div>
          <div class="form-group">
            <label>محل تولد</label>
            <input type="text" id="person-birth-place" />
          </div>
          <div class="form-group">
            <label>تاریخ فوت</label>
            <input type="text" id="person-death-date" placeholder="خالی = زنده" />
          </div>
          <div class="form-group">
            <label>محل فوت / دفن</label>
            <input type="text" id="person-death-place" />
          </div>
          <div class="form-group full-width">
            <label>شغل</label>
            <input type="text" id="person-occupation" />
          </div>
          <div class="form-group full-width">
            <label>توضیحات / زندگینامه</label>
            <textarea id="person-bio" rows="4"></textarea>
          </div>
          <div class="form-group">
            <label>درجه اطمینان</label>
            <select id="person-confidence">
              <option value="certain">قطعی 🟢</option>
              <option value="probable">احتمالی 🟡</option>
              <option value="uncertain">نامشخص 🔴</option>
            </select>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost modal-close">انصراف</button>
        <button class="btn btn-danger hidden" id="btn-delete-person">حذف فرد</button>
        <button class="btn btn-primary" id="btn-save-person">ذخیره</button>
      </div>
    </div>
  </div>

  <!-- Modal: Add Relationship -->
  <div class="modal" id="modal-relationship">
    <div class="modal-content">
      <div class="modal-header">
        <h3>افزودن رابطه</h3>
        <button class="btn-icon modal-close">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>نوع رابطه</label>
          <select id="rel-type">
            <option value="parent">پدر / مادر</option>
            <option value="child">فرزند</option>
            <option value="spouse">همسر</option>
            <option value="sibling">خواهر / برادر</option>
          </select>
        </div>
        <div class="form-group">
          <label>انتخاب فرد</label>
          <select id="rel-person"></select>
        </div>
        <div class="form-group" id="rel-parent-type-group">
          <label>نوع والد</label>
          <select id="rel-parent-type">
            <option value="father">پدر</option>
            <option value="mother">مادر</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost modal-close">انصراف</button>
        <button class="btn btn-primary" id="btn-save-relationship">افزودن رابطه</button>
      </div>
    </div>
  </div>

  <!-- Modal: Person Detail / Profile -->
  <div class="modal" id="modal-profile">
    <div class="modal-content modal-lg">
      <div class="modal-header">
        <h3 id="profile-name">پروفایل</h3>
        <button class="btn-icon modal-close">×</button>
      </div>
      <div class="modal-body" id="profile-content">
        <!-- Dynamic content -->
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" id="btn-edit-person">ویرایش</button>
        <button class="btn btn-primary" id="btn-add-rel">افزودن رابطه</button>
        <button class="btn btn-ghost modal-close">بستن</button>
      </div>
    </div>
  </div>

  <!-- Modal: Export -->
  <div class="modal" id="modal-export">
    <div class="modal-content">
      <div class="modal-header">
        <h3>خروجی گرفتن</h3>
        <button class="btn-icon modal-close">×</button>
      </div>
      <div class="modal-body">
        <div class="export-options">
          <button class="export-card" data-type="pdf">
            <span class="export-icon">📄</span>
            <span class="export-title">PDF</span>
            <span class="export-desc">شجره‌نامه قابل چاپ</span>
          </button>
          <button class="export-card" data-type="png">
            <span class="export-icon">🖼️</span>
            <span class="export-title">PNG</span>
            <span class="export-desc">تصویر با کیفیت بالا</span>
          </button>
          <button class="export-card" data-type="html">
            <span class="export-icon">🌐</span>
            <span class="export-title">HTML</span>
            <span class="export-desc">سایت کامل مستقل</span>
          </button>
          <button class="export-card" data-type="json">
            <span class="export-icon">📦</span>
            <span class="export-title">JSON</span>
            <span class="export-desc">پشتیبان‌گیری داده</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Settings -->
  <div class="modal" id="modal-settings">
    <div class="modal-content">
      <div class="modal-header">
        <h3>تنظیمات</h3>
        <button class="btn-icon modal-close">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>فونت</label>
          <select id="setting-font">
            <option value="Vazirmatn">وزیرمتن (پیشنهادی)</option>
            <option value="Tahoma">تahoma</option>
            <option value="Arial">Arial</option>
          </select>
        </div>
        <div class="form-group">
          <label>تم رنگی</label>
          <select id="setting-theme">
            <option value="green">سبز (پیش‌فرض)</option>
            <option value="blue">آبی</option>
            <option value="brown">قهوه‌ای سنتی</option>
            <option value="dark">تیره</option>
          </select>
        </div>
        <div class="form-group">
          <label>اندازه کارت افراد</label>
          <select id="setting-card-size">
            <option value="small">کوچک</option>
            <option value="medium" selected>متوسط</option>
            <option value="large">بزرگ</option>
          </select>
        </div>
        <hr />
        <div class="form-group">
          <button class="btn btn-outline btn-block" id="btn-export-json">دانلود پشتیبان (JSON)</button>
        </div>
        <div class="form-group">
          <button class="btn btn-danger btn-block" id="btn-clear-data">پاک کردن تمام داده‌ها</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <script src="js/db.js"></script>
  <script src="js/tree.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
